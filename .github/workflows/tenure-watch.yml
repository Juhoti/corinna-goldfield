name: Tenure watch

on:
  schedule:
    # Mondays 20:00 UTC (Tuesday morning in Tasmania). MRT updates daily;
    # weekly is enough except in December 2026 — tighten to daily then if
    # you want the lapse the morning it happens.
    - cron: "0 20 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot tenure and diff against committed state
        run: python tenure_watch.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet tenure_state.json; then
            git config user.name "tenure-watch"
            git config user.email "github-actions@users.noreply.github.com"
            git add tenure_state.json
            git commit -m "tenure watch: state update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open issue on change
        if: ${{ hashFiles('tenure_diff.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Tenure change detected $(date -u +%Y-%m-%d)" \
            --body-file tenure_diff.md
